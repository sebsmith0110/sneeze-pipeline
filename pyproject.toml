[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]

[project]
name = "sneeze-pipeline"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "boto3>=1.43.125",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "moto[s3,secretsmanager]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "responses>=0.26.3",
]
