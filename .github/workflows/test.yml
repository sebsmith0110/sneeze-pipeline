name: Tests

on:
  push:
    branches-ignore: [ main ]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Compile check & pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs uv; uv then reads .python-version and fetches Python 3.11 itself
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # Dev dependencies (pytest, moto, ...) are included by default.
      - name: Install dependencies
        run: uv sync --locked

      - name: Check code compiles
        run: uv run python -m compileall app -q

      - name: Run tests
        run: uv run pytest
